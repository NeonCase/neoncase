/* ===== СКИЛЛ-ЧЕК: заработок кристаллов. Серия из 10 чеков, пауза 30 с; ширина зоны сужается и стрелка ускоряется с комбо ===== */
const SCN=10,SCCD=30000;let SC={ph:'idle'}; // серия из 10 чеков, пауза 30 с (отсчёт идёт и если закрыть окно посреди серии)
const scM=()=>{const r=Math.random();return r<.3?.7+Math.random()*.3:r<.7?1+Math.random()*.5:r<.92?1.5+Math.random()*.5:2+Math.random()*.5}; // множитель ×0.7…×2.5
const sa=(a,b,r)=>{const p=d=>[(60+r*Math.sin(d*Math.PI/180)).toFixed(2),(60-r*Math.cos(d*Math.PI/180)).toFixed(2)],[x1,y1]=p(a),[x2,y2]=p(b);return `M${x1} ${y1}A${r} ${r} 0 ${b-a>180?1:0} 1 ${x2} ${y2}`};
const scSay=(m,c)=>{const e=$('#scm');if(e){e.textContent=m;e.style.color=c||''}};
function scOpen(){if($('#sc'))return scClose();document.body.insertAdjacentHTML('beforeend',`<div id=sc class=scp data-a=schit><div class=row style="justify-content:space-between"><b>💎 Заработай кристаллы</b><button class=btn data-a=scx>✕</button></div><svg viewBox="0 0 120 120"><defs><radialGradient id=scg cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#241a5e"/><stop offset="1" stop-color="#0b0a14"/></radialGradient><linearGradient id=scn1 x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ef4444"/></linearGradient><linearGradient id=scr x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><circle cx="60" cy="60" r="58" fill="url(#scg)" stroke="url(#scr)" stroke-width="2"/><circle cx="60" cy="60" r="53" fill="none" stroke="#ffffff30" stroke-width="3" stroke-dasharray="1.2 4.25"/><circle cx="60" cy="60" r="46" fill="none" stroke="#ffffff14" stroke-width="10"/><path id=scw fill="none" stroke="#fff" stroke-width="10" style="filter:drop-shadow(0 0 5px #fff)"/><path id=scp fill="none" stroke="#c084fc" stroke-width="10" style="filter:drop-shadow(0 0 7px #a855f7)"/><g id=scl style="transform-origin:60px 60px;filter:drop-shadow(0 0 4px #ef4444)"><path d="M60 62L56.5 24L60 6L63.5 24Z" fill="url(#scn1)"/><path d="M60 58L57.5 70H62.5Z" fill="#ef4444"/></g><circle cx="60" cy="60" r="8" fill="#1b1540" stroke="#ef4444" stroke-width="2"/><circle cx="60" cy="60" r="3" fill="#ef4444"/></svg><div id=scm class=scm>Нажмите «Запустить»</div><div id=scn class=scn></div><button class="btn pri" id=scb data-a=scgo>Запустить</button><p><small>Пробел или клик по любому месту окна. ⚪ хорошо +50, 🟣 отлично +625 (в каждом чеке, зона маленькая), затем случайный множитель ×0.7–×2.5 и бонус за комбо. Серия ${SCN} чеков, потом пауза 30 с — она идёт даже если закрыть окно раньше.</small></p></div>`)}
function scClose(){cancelAnimationFrame(SC.raf);if(['warn','run','wait'].includes(SC.ph)){S.sc=Date.now()+SCCD;rpc('ng_sc_end').then(d=>ap(d),()=>{})} // закрыл посреди серии — пауза всё равно идёт
 SC={ph:'idle'};$('#sc')?.remove()}
A.scx=scClose;
A.scgo=async()=>{const w=(S.sc||0)-Date.now();if(w>0)return scSay('Пауза: ещё '+Math.ceil(w/1e3)+' с');if(SC.ph!='idle'&&SC.ph!='done'||RB)return;RB=1;let d;
 try{d=await rpc('ng_sc_start')}catch(e){RB=0;return scSay(e.message,'#f87171')}RB=0;ap(d);SC={ph:'warn',n:0,combo:0,earn:0};$('#scb').disabled=true;scNext()};
function scNext(){if(!$('#sc'))return;SC.ph='warn';$('#scn').textContent=`Чек ${SC.n+1}/${SCN} · заработано ${f(SC.earn)}`;scSay('Приготовься…','#fbbf24');beep(500,.12,'square',.05);setTimeout(scRun,800)}
function scRun(){if(!$('#sc'))return;const l=Math.min(SC.combo,8);SC.v=140+l*10;SC.zw=Math.max(28,48-l*2);SC.pw=Math.max(5,SC.zw*.14);
 SC.a=Math.random()*360;SC.z0=SC.a+110+Math.random()*150;SC.z1=SC.z0+SC.zw;const m=SC.z0%360;
 $('#scw').setAttribute('d',sa(m,m+SC.zw,46));$('#scp').setAttribute('d',sa(m,m+SC.pw,46));
 SC.t=performance.now();SC.ph='run';scSay('Жми!','#fff');beep(700,.06,'sine',.06);SC.raf=requestAnimationFrame(scLoop)}
function scLoop(n){if(SC.ph!='run')return;SC.a+=SC.v*(n-SC.t)/1e3;SC.t=n;const l=$('#scl');if(l)l.style.transform=`rotate(${SC.a}deg)`;if(SC.a>SC.z1)return scRes(0);SC.raf=requestAnimationFrame(scLoop)}
A.schit=()=>{if(SC.ph=='run')scRes(SC.a>=SC.z0&&SC.a<=SC.z1?(SC.pw&&SC.a<=SC.z0+SC.pw?2:1):0)};
document.addEventListener('keydown',e=>{if(e.code=='Space'&&$('#sc')&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();A.schit()}});
async function scRes(k){SC.ph='wait';cancelAnimationFrame(SC.raf);let d;const scn=h=>{const e=$('#scn');if(e)e.innerHTML=h};
 try{d=await rpc('ng_sc_hit',{p_k:k})}catch(e){if(/быстро/i.test(e.message)){scSay('Слишком быстро','#fbbf24');return setTimeout(scNext,1000)}
  scSay(e.message,'#f87171');SC.ph='done';const b=$('#scb');if(b){b.disabled=false;b.textContent='Новая серия'}return}
 ap(d);
 if(k){SC.combo++;SC.earn+=+d.r;beep(k==2?1100:850,.25,'triangle',.08);scSay(`+${d.r} 💎 · ${k==2?'ОТЛИЧНО':'хорошо'}${d.capped?' (лимит в час)':''}`,k==2?'#a855f7':'#34d399');scn(`Множитель: <b>×${(+d.m).toFixed(2)}</b> · комбо ×${(+d.cb).toFixed(2)}`)}
 else{SC.combo=0;beep(130,.35,'sawtooth',.07);scSay('Промах','#ef4444');scn('Комбо сброшено')}
 SC.n++;if(d.fin||SC.n>=SCN)setTimeout(()=>{SC.ph='done';scSay(`Серия окончена: +${f(SC.earn)}`,'#fbbf24');const b=$('#scb');if(b){b.disabled=false;b.textContent='Новая серия (пауза 30 с)'}},1000);else setTimeout(scNext,1000)}

const trSync=()=>{const g=k=>$('[data-h='+k+']');if(g('trn'))TR.to=g('trn').value.trim();if(g('trgm'))TR.gm=Math.max(0,Math.floor(+g('trgm').value||0));if(g('trgt'))TR.gt=Math.max(0,Math.floor(+g('trgt').value||0))};
const tit=a=>(a||[]).map(x=>{const i=ITEMS[x.i];return i?`<small style="color:${RC[i.r]}">${hx(i.n)} · ${f(i.p)}</small>`:''}).join('')||'<small>—</small>';
const trCard=(t,m)=>`<div class=box><div class=row><b>${m=='in'?'От '+hx(t.from):m=='out'?'Кому: '+hx(t.to):hx(t.from)+' → '+hx(t.to)}</b><small>${ago(t.created)}</small>${m=='h'?'<b>'+({accepted:'✅ принят',declined:'❌ отклонён',cancelled:'⛔ отменён',expired:'⌛ истёк'}[t.status]||t.status)+'</b>':''}</div><div class=cols><div class=tr3><b>Отдаёт</b>${tit(t.sf)}${t.gf?`<b class=pr>${f(t.gf)}</b>`:''}</div><div class=tr3><b>Просит</b>${tit(t.st)}${t.gt?`<b class=pr>${f(t.gt)}</b>`:''}</div></div>${m=='in'?`<div class=row><button class="btn g" data-a=tracc data-id=${t.id}>Принять</button><button class=btn data-a=trdec data-id=${t.id}>Отклонить</button></div>`:m=='out'?`<div class=row><button class=btn data-a=trcan data-id=${t.id}>Отменить</button></div>`:''}</div>`;
const trHtml=()=>{const L=TR.list;if(!L)return '<small>Загрузка…</small>';return '<h3>Входящие</h3>'+(L.in.map(t=>trCard(t,'in')).join('')||'<small>Нет входящих предложений</small>')+'<h3>Исходящие</h3>'+(L.out.map(t=>trCard(t,'out')).join('')||'<small>Нет исходящих предложений</small>')+'<h3>История</h3>'+(L.h.map(t=>trCard(t,'h')).join('')||'<small>Пока пусто</small>')};
async function trLoad(){if(!OL.ready||TR.busy)return;TR.busy=1;try{const d=await rpc('ng_trades_list');TR.list=d;TIN=(d.in||[]).length;const e=$('#trl');if(e)e.innerHTML=trHtml()}catch(e){}TR.busy=0}
P.tr=()=>{trLoad();const mine=S.inv.filter(v=>!v.lk),th=TR.theirs;
 const st=th?th.filter(v=>TR.tt.has(v.u)).reduce((a,v)=>a+ITEMS[v.i].p,0):0;
 return `<h2>Трейды</h2><div class=box><h3>Предложить обмен</h3><p><small>Предметы, которые вы отдаёте, блокируются до ответа. Предложение действует 24 часа. Для обменов нужно открыть минимум 10 кейсов.</small></p><div class=row><input data-h=trn placeholder="Ник игрока" value="${hx(TR.to)}"><button class="btn pri" data-a=trload>Показать инвентарь</button></div>${th?`<div class=cols style="margin-top:10px"><div><h4>Вы отдаёте · ${f(invSum(TR.tm))}</h4><input type=number min=0 data-h=trgm placeholder="+ 💎 от вас" value="${TR.gm||''}"><div class="grid scroll" style="margin-top:8px">${mine.map(v=>ic(ITEMS[v.i],`data-a=trm data-u=${v.u}`,TR.tm.has(v.u)?'sel':'')).join('')||'<small>Нет свободных предметов</small>'}</div></div><div><h4>Вы просите · ${f(st)}</h4><input type=number min=0 data-h=trgt placeholder="+ 💎 от игрока" value="${TR.gt||''}"><div class="grid scroll" style="margin-top:8px">${th.filter(v=>ITEMS[v.i]).map(v=>ic(ITEMS[v.i],`data-a=trt data-u=${v.u}`,(v.lk?'lk ':'')+(TR.tt.has(v.u)?'sel':''))).join('')||'<small>У игрока нет предметов</small>'}</div></div></div><div class=row style="margin-top:10px"><button class="btn g" data-a=trsend>Отправить предложение</button></div>`:''}</div><div id=trl>${trHtml()}</div>`};
const trAct=(fn,msg)=>async d=>{if(RB)return;RB=1;try{const r=await rpc(fn,{p_id:+d.id});ap(r);toast(r&&r.err?r.err:msg);await loadState()}catch(e){fail(e)}RB=0;trLoad()};
Object.assign(A,{
 trload:async()=>{trSync();if(!TR.to)return toast('Введите ник игрока');try{const d=await rpc('ng_user_inv',{p_username:TR.to});TR.theirs=d||[];TR.tm.clear();TR.tt.clear();render()}catch(e){toast(e.message)}},
 trm:d=>{trSync();tog(TR.tm,+d.u);render()},
 trt:d=>{trSync();const v=(TR.theirs||[]).find(x=>x.u==+d.u);if(v&&v.lk)return toast('Предмет в другом обмене');tog(TR.tt,+d.u);render()},
 trsend:async()=>{trSync();if(RB)return;if(!TR.to)return toast('Введите ник игрока');RB=1;
  try{const d=await rpc('ng_trade_create',{p_to:TR.to,p_items_from:[...TR.tm],p_gems_from:TR.gm,p_items_to:[...TR.tt],p_gems_to:TR.gt});ap(d);toast('Предложение отправлено');TR.tm.clear();TR.tt.clear();TR.gm=TR.gt=0;TR.theirs=null;await loadState()}catch(e){fail(e)}RB=0;trLoad();render()},
 tracc:trAct('ng_trade_accept','Обмен выполнен'),trdec:trAct('ng_trade_decline','Отклонено'),trcan:trAct('ng_trade_cancel','Предложение отменено')});
setInterval(()=>{if(OL.ready&&cur()=='#tr'&&!RB)trLoad()},8000);

/* ===== НЕТ ИНТЕРНЕТА ===== */
function offUi(on){const e=$('#off');if(on&&!e){document.body.insertAdjacentHTML('beforeend','<div id=off style="position:fixed;inset:0;z-index:1900;background:#05030ff2;backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px"><div class=box style="max-width:420px;text-align:center"><div style="font-size:64px">📡</div><h2>Нет подключения к интернету</h2><p>Проверьте Wi-Fi или мобильную сеть. Игра продолжится автоматически, когда связь вернётся — прогресс не потеряется.</p></div></div>');document.querySelectorAll('header,main,#live').forEach(x=>x.inert=true)}
 else if(!on&&e){e.remove();if(!LOCKED)document.querySelectorAll('header,main,#live').forEach(x=>x.inert=false);if(OL.ready)cloudSave()}}
addEventListener('offline',()=>offUi(1));addEventListener('online',()=>offUi(0));if(!navigator.onLine)offUi(1);

/* ===== РОУТЕР ===== */
const NAV=[['cases','Кейсы'],['up','Апгрейд'],['ct','Контракты'],['bt','Баттл'],['mn','Mines'],['inv','Инвентарь'],['tr','Трейды'],['sh','Магазин'],['lb','Онлайн'],['bn','Бонусы'],['pf','Профиль']];
let RT=null;const cur=()=>RT||location.hash||'#cases';
let RPG=null;
function render(){if(busy)return;const sv=[...document.querySelectorAll('.scroll')].map(e=>e.scrollTop),wy=scrollY;const [p,a]=cur().slice(1).split('/'),pg=P[p]?p:'cases';
 $('#nav').innerHTML=NAV.map(([k,n])=>`<a href="#${k}" class="${k==pg||(k=='cases'&&pg=='case')?'on':''}">${n}${k=='tr'&&TIN?' ('+TIN+')':''}</a>`).join('');
 $('#app').innerHTML=P[pg](a);if(RPG===pg){document.querySelectorAll('.scroll').forEach((e,i)=>{if(sv[i])e.scrollTop=sv[i]});scrollTo(0,wy)}RPG=pg;upd()}
addEventListener('hashchange',()=>{RT=null;render()});
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();if(busy)return;RT=a.getAttribute('href');try{history.replaceState(null,'',RT)}catch(x){}render();scrollTo(0,0)});
setInterval(()=>document.querySelectorAll('[data-tm]').forEach(e=>{const l=+e.dataset.tm-Date.now();e.textContent=l>0?hms(l):'Готово!'}),1000);
try{feed('Система',roll(CASES[0]))}catch(e){console.error(e)}
try{render()}catch(e){console.error(e)}
boot();
</script></body></html>
